name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Tests use a fake Claude client, so no API key or extra packages are needed.
      - run: python -m unittest discover -s tests -t . -v
